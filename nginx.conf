# 官方 Nginx 镜像启动时仅替换 BACKEND_UPSTREAM，保留 Nginx 自身变量。
map $http_x_forwarded_proto $registry_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 100m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / { return 302 /knowledge-accumulation/registry/; }
    location = /knowledge-accumulation/registry { return 308 /knowledge-accumulation/registry/; }
    location = /knowledge-accumulation/registry/api { return 404; }

    # 保留 /knowledge-accumulation/registry/api 路径和鉴权头，API 不走 SPA 回退。
    location ^~ /knowledge-accumulation/registry/api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $registry_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 330s;
    }

    location ^~ /knowledge-accumulation/registry/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/knowledge-accumulation/registry/.*\.[^/]+$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /knowledge-accumulation/registry/ {
        try_files $uri $uri/ /knowledge-accumulation/registry/index.html;
        add_header Cache-Control "no-cache";
    }

    location / { return 404; }
}
