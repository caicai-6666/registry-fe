# 放入映射服务器现有 HTTPS server；gateway-map.conf 加入 http 上下文。
# Vite 源码服务入口保留 /dev；本机 Vite 的 API 代理再移除 /dev。
location = /dev/knowledge-accumulation/registry {
    return 308 /dev/knowledge-accumulation/registry/;
}

location ^~ /dev/knowledge-accumulation/registry/ {
    proxy_pass http://127.0.0.1:23080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $registry_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 330s;
    client_max_body_size 100m;
}
