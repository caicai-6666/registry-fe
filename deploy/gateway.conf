# 仅用于生产容器：添加到 pheno.szkl.com 现有 HTTPS server 块内。
# 开发 /dev/registry/ 由现有映射服务器去掉 /dev 并转发到本机，不使用此片段。
# 同时将 gateway-map.conf 加入 http 上下文。
# 必须保留 /registry/ 前缀；不要覆盖现有其他应用的 location。
location = /registry {
    return 308 /registry/;
}

location ^~ /registry/ {
    proxy_pass http://127.0.0.1:23080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $registry_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 100m;
}
