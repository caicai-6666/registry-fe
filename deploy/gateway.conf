# 添加到 pheno.szkl.com 现有 HTTPS server；gateway-map.conf 加入 http 上下文。
# 更具体的注册中心子路径优先于统一入口，页面、API 和 WebSocket 原样转发。
location = /knowledge-accumulation/registry {
    return 308 /knowledge-accumulation/registry/;
}

location ^~ /knowledge-accumulation/registry/ {
    proxy_pass http://127.0.0.1:23080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $registry_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 330s;
    client_max_body_size 100m;
}
